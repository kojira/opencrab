name: CI

on:
  push:
    branches: [main]
  pull_request:

# 同一ブランチの古い実行はキャンセルして無駄を省く
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  rust:
    name: Rust (fmt / clippy / build / test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # songbird(voice) は opus、reqwest(native-tls) は OpenSSL、
      # audiopus_sys のビルドに cmake/pkg-config が要る。rusqlite は bundled。
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake pkg-config libopus-dev libssl-dev lld

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      # 警告レベルの lint では失敗しないが、workspace の deny 指定
      # (await_holding_lock 等) は clippy がここで強制する。
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features

      - name: Build
        run: cargo build --workspace --all-features

      - name: Test
        run: cargo test --workspace --all-features

  web:
    name: Web (typecheck / build / test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      # `npm run build` は tsc -b（型チェック）+ vite build を実行する。
      - name: Typecheck & build
        run: npm run build

      - name: Test
        run: npm run test
