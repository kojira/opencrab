[agent]
heartbeat_interval_secs = 1800
heartbeat_enabled = true
workspace_path = "data/agents/{agent_id}/workspace"
max_workspace_size_mb = 100

# デフォルトLLM設定
[llm]
default_provider = "anthropic"
default_model = "claude-sonnet-4-6"

# 用途別モデル設定（オプション）
[llm.models]
thinking = { provider = "anthropic", model = "claude-sonnet-4-6" }
conversation = { provider = "anthropic", model = "claude-sonnet-4-6" }
analysis = { provider = "anthropic", model = "claude-sonnet-4-6" }
tool_calling = { provider = "anthropic", model = "claude-sonnet-4-6" }
creative = { provider = "anthropic", model = "claude-sonnet-4-6" }
embedding = { provider = "openai", model = "text-embedding-3-large" }

# エージェント自身によるLLM選択
[llm.self_selection]
enabled = true
allowed_aliases = ["fast", "smart", "reasoning", "creative", "local", "cheap"]

# フォールバックチェーン
[llm.fallback]
chain = ["anthropic", "ollama"]

# OpenAI設定
[llm.providers.openai]
api_key = "${OPENAI_API_KEY}"
base_url = "https://api.openai.com/v1"
organization = ""

# Anthropic設定
[llm.providers.anthropic]
api_key = "${ANTHROPIC_API_KEY}"
base_url = "https://api.anthropic.com"

# Google設定
[llm.providers.google]
api_key = "${GOOGLE_API_KEY}"

# OpenRouter設定
[llm.providers.openrouter]
api_key = "${OPENROUTER_API_KEY}"
base_url = "https://openrouter.ai/api/v1"
site_url = ""
app_name = "OpenCrab"

# Ollama設定（ローカル）
[llm.providers.ollama]
base_url = "http://localhost:11434"
default_model = "llama3.1:8b"

# llama.cpp設定（ローカル）
[llm.providers.llamacpp]
base_url = "http://localhost:8080"

# モデルエイリアス
[llm.aliases]
fast = { provider = "anthropic", model = "claude-haiku-4-5" }
smart = { provider = "anthropic", model = "claude-sonnet-4-6" }
reasoning = { provider = "anthropic", model = "claude-sonnet-4-6" }
creative = { provider = "anthropic", model = "claude-sonnet-4-6" }
local = { provider = "ollama", model = "llama3.1:8b" }
cheap = { provider = "anthropic", model = "claude-haiku-4-5" }

[gateway.rest]
enabled = true
port = 8080

[gateway.discord]
enabled = true
token = "${DISCORD_TOKEN}"
guild_ids = []
agent_ids = ["crab"]  # Discordメッセージに応答するエージェントID（例: ["crab", "philosopher"]）
owner_discord_id = "390732846236434452"  # DMに応答するオーナーのDiscord User ID
heartbeat_channel_id = 1470698801395273861

[gateway.cli]
enabled = true

[dashboard]
enabled = true
port = 3000

[database]
path = "data/opencrab.db"

# ===== ツール設定 =====
[tools]
enabled = true

[tools.shell]
enabled = true
allowed_commands = []
timeout_secs = 30
inherit_env = false
allowed_env_vars = ["PATH", "HOME", "LANG"]
max_output_bytes = 65536

[[tools.shell.commands]]
name = "curl"
permission = "agent"
timeout_secs = 30

[[tools.shell.commands]]
name = "echo"
permission = "agent"

[[tools.shell.commands]]
name = "date"
permission = "agent"

[[tools.shell.commands]]
name = "jq"
permission = "agent"

[[tools.shell.commands]]
name = "ls"
permission = "agent"

[[tools.shell.commands]]
name = "whoami"
permission = "owner"

[[tools.shell.commands]]
name = "cat"
permission = "agent"

[[tools.shell.commands]]
name = "which"
permission = "agent"
description = "コマンドの場所確認"

[[tools.shell.commands]]
name = "grep"
permission = "agent"
description = "テキスト検索"

[[tools.shell.commands]]
name = "python3"
permission = "agent"
description = "Python3スクリプト実行"
