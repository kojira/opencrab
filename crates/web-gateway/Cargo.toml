[package]
name = "opencrab-web-gateway"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
tokio.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tracing.workspace = true
dashmap.workspace = true
# HTTP 境界（ルータ + ハンドラ / #190 S4）。上位は `.merge(http::routes())` するだけ。
axum.workspace = true
futures.workspace = true

opencrab-core.workspace = true
opencrab-actions.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
# ルータへ実リクエストを流すため（`ServiceExt::oneshot`）。パスの一致・クエリ名・
# レスポンス body を HTTP 経由で検査する（#195 レビュー対応）。
tower = { workspace = true }
# SSE の body をフレーム単位で読む（取りこぼし時に継続することの確認）。
http-body-util = "0.1"
