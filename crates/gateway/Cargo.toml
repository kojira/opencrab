[package]
name = "opencrab-gateway"
version.workspace = true
edition.workspace = true

[features]
default = ["discord"]
discord = ["serenity", "songbird"]

[dependencies]
tokio = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
serenity = { workspace = true, optional = true }
songbird = { workspace = true, optional = true }
# A2UI の描画面（`GatewayActions::a2ui_surface`）がコアの型を返すため（#156 S3）。
# core は gateway に依存しないので循環はしない。
opencrab-core = { workspace = true }

[lints]
workspace = true
