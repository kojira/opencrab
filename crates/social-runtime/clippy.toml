# core 専用の clippy 設定（この Cargo パッケージのコンパイル時にだけ効く）。
#
# 「引けなかった（Err）」と「無かった（Ok(None)/false/空）」を混ぜる形を、レビューではなく
# **ビルド**で止める（clippy は -D warnings で回っている）。混ぜる典型は、store の読みが返す
# `Result` の `Err` を、値の側へ黙って畳む次の combinator:
#   - `Result::ok`            … Err を Option の None に落とす（一番よく出る）
#   - `Result::unwrap_or`     … Err を既定値（false・0・…）に落とす
#   - `Result::unwrap_or_default` … Err を Default（空 Vec・false・…）に落とす
#   - `Result::unwrap_or_else`    … Err を握り潰して別の値にする
#
# これらが core に新しく書かれると、この crate のビルド（clippy）が止まる。正当な用途
# （壁時計が epoch 前・try-lock の空き判定・配送ワーカーの best-effort 記録など、Err に意味の
# 情報が無い所）は、その行に `#[allow(clippy::disallowed_methods)]` を**明示**して残す。
# 黙って潰せない＝レビュー待ちにならずビルドで気づく、という目的はこれで達する。
#
# 注意: ここで禁じるのは `Result` のこれらだけ。`Option::ok`/`Option::unwrap_or` 等は別パスなので
# 影響しない（引数の既定値埋めなどは従来どおり）。
disallowed-methods = [
    { path = "core::result::Result::ok", reason = "Result の Err を握り潰して None にしない（§15）。正当なら #[allow] を明示" },
    { path = "core::result::Result::unwrap_or", reason = "Err を既定値に潰さない（§15）。正当なら #[allow] を明示" },
    { path = "core::result::Result::unwrap_or_default", reason = "Err を Default に潰さない（§15）。正当なら #[allow] を明示" },
    { path = "core::result::Result::unwrap_or_else", reason = "Err を握り潰さない（§15）。正当なら #[allow] を明示" },
]
