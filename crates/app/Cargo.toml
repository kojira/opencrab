[package]
name = "opencrab-app"
edition.workspace = true
version.workspace = true

[lib]
name = "opencrab_app"
path = "src/lib.rs"

[[bin]]
name = "opencrab-social-runtime"
path = "src/bin/opencrab-social-runtime.rs"

[[bin]]
name = "opencrab-gate-status"
path = "src/bin/opencrab-gate-status.rs"

# LLM ログの読み口（#766）。読み取り専用で稼働 DB を覗き、リスト＋詳細を出す。
[[bin]]
name = "opencrab-llm-logs"
path = "src/bin/opencrab-llm-logs.rs"

# tool 実行ログの読み口（#787）。読み取り専用。list / show のみ（stats は作らない）。
[[bin]]
name = "opencrab-tool-logs"
path = "src/bin/opencrab-tool-logs.rs"

[[bin]]
name = "opencrab-gate-runner"
path = "src/bin/opencrab-gate-runner.rs"

[[bin]]
name = "opencrab-discord-launch-list"
path = "src/bin/opencrab-discord-launch-list.rs"

# e2e が必ず「いまの web-gate のコード」を動かすための保証（タスク #1）。
# web-gate の本体は別クレート `web-gate`（core の型を使わない構造規律はそこで保たれる）。ここは
# その**同じソース**を app 自身の bin として持つだけ。同一パッケージの bin なので cargo は
# `CARGO_BIN_EXE_web-gate-e2e` を e2e に渡し、テスト前に**必ず再ビルドする** — `-p opencrab-app` の
# ような絞り込みでも古いバイナリで緑にならない（兄弟クレートの bin は絞り込みでは作り直されない）。
# 手順書の「先に build しろ」に依存しない（書き忘れが起き得ない）。
# `test = false`: 同じソースの `#[cfg(test)]` を二重に走らせない（本体は `web-gate` クレートで走る）。
[[bin]]
name = "web-gate-e2e"
path = "../web-gate/src/main.rs"
test = false

# Nostr process E2E has the same freshness requirement as web: the integration test must execute
# the gate source from this checkout, not a manually prebuilt sibling binary.
[[bin]]
name = "nostr-gate-e2e"
path = "../nostr-gate/src/main.rs"
test = false

[[bin]]
name = "discord-gate-e2e"
path = "../discord-gate/src/main.rs"
test = false

[dependencies]
opencrab-port = { path = "../port" }
opencrab-store = { path = "../store" }
opencrab-social-runtime = { path = "../social-runtime" }
opencrab-converter = { path = "../converter" }
opencrab-db = { path = "../db" }
rusqlite.workspace = true
opencrab-plugd = { path = "../plugd" }
opencrab-nostr-gate = { path = "../nostr-gate" }
opencrab-discord-gate = { path = "../discord-gate" }
serenity = { version = "0.12.5", default-features = false, features = [
    "client",
    "gateway",
    "model",
    "cache",
    "http",
    "rustls_backend",
] }
# process: 平文専用の cursor engine が `cursor-agent` CLI を子プロセスで起動する（crates/app/src/cursor.rs）。
tokio = { workspace = true, features = ["rt", "macros", "sync", "time", "net", "io-util", "process"] }
async-trait = { workspace = true }
serde_json = { workspace = true }
# 本物のプロバイダの HTTPS 終端（TLS を自前で張らない・オーナー判断）。rustls + webpki の根。
# 断片は `Response::chunk()` で読む（stream 機能）。gzip 等は要らない（SSE は非圧縮）。
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
# cursor engine の空の一時 cwd（RAII で削除・孤児を残さない）。deny cli.json の置き場（crates/app/src/cursor.rs）。
tempfile = "3"
libc = "0.2"
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
base64 = "0.22"
ring = "0.17"
zeroize = "1"

[dev-dependencies]
opencrab-engine = { path = "../engine" }
rusqlite.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "sync", "time", "net", "io-util", "process", "rt-multi-thread"] }
# 本物の TLS 経路でアイドル上限が効くことを見せるための、ローカルの自己署名 TLS サーバ。
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rcgen = "0.13"
