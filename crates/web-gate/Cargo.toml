[package]
name = "opencrab-web-gate"
edition.workspace = true
version.workspace = true

# web ゲート（プラグイン）。**core の型を一切使わない** — 依存は tokio と serde_json だけ。
# 線に載る JSON を仕様書（プロトコル 版1）だけを見て自分で組む。共有した瞬間、プロトコルではなく
# Rust の型を検証していることになる（タスクの規律）。クレートの依存グラフに opencrab-* が無いので、
# 「うっかり core の型を使う」が構造的に起きない。
[[bin]]
name = "web-gate"
path = "src/main.rs"

[dependencies]
tokio = { workspace = true, features = ["rt", "macros", "sync", "time", "net", "io-util"] }
serde_json = { workspace = true }
