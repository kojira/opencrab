[package]
name = "opencrab-core"
version.workspace = true
edition.workspace = true

[dependencies]
tokio = { workspace = true }
async-trait = { workspace = true }
# A2UI の保留インタラクション登録簿（`a2ui::PendingInteractionRegistry`）用。
dashmap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
iana-time-zone = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
sha2 = { workspace = true }
tiktoken-rs = { workspace = true }
memchr = { workspace = true }
rusqlite = { workspace = true }
opencrab-db = { workspace = true }
opencrab-llm-types = { workspace = true }
# at-rest 秘密（Nostr 本鍵・生成鍵）の暗号化保管層（#620）。XChaCha20-Poly1305 は
# ワークスペースに既にある依存（transitive）。base64/zeroize/getrandom も同様。
chacha20poly1305 = "0.10"
base64 = "0.22"
zeroize = "1"
getrandom = "0.2"

[dev-dependencies]
tempfile = { workspace = true }
# test-util: ハートビートループの周期を仮想時間で検証する（`#[tokio::test(start_paused)]`）。
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
