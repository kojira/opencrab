[package]
name = "opencrab-server"
version.workspace = true
edition.workspace = true

[features]
default = ["discord", "nostr", "web"]
discord = ["dep:opencrab-discord"]
nostr = ["dep:opencrab-nostr"]
web = ["dep:opencrab-web-gateway"]
baseline-l1 = ["discord", "nostr", "web"]
baseline-l2 = ["baseline-l1"]

[[bin]]
name = "baseline-l1"
path = "src/bin/baseline-l1.rs"
required-features = ["baseline-l1"]

[[bin]]
name = "baseline-l2"
path = "src/bin/baseline-l2.rs"
required-features = ["baseline-l2"]

[dependencies]
tokio = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
iana-time-zone = { workspace = true }
dashmap = { workspace = true }
rusqlite = { workspace = true }
opencrab-core = { workspace = true }
opencrab-llm = { workspace = true }
opencrab-llm-types = { workspace = true }
opencrab-gateway = { workspace = true }
opencrab-actions = { workspace = true }
opencrab-db = { workspace = true }
opencrab-extgate = { workspace = true }
opencrab-nostr = { workspace = true, optional = true }
opencrab-web-gateway = { workspace = true, optional = true }
opencrab-mcp = { workspace = true }
dotenvy = { workspace = true }
toml = { workspace = true }
opencrab-discord = { workspace = true, optional = true }
opencrab-voice = { workspace = true }
notify = "6"
notify-debouncer-mini = "0.4"
# Nostr 受信 → Discord 転記（#252 段階 A）の非ブロック webhook POST。server は
# 各 gateway の transport を配線する合流点なので、ここで直接 HTTP を出す。
reqwest = { workspace = true }
# 古い llm_logs の zip アーカイブ（#337）。deflate のみに絞り、bzip2/zstd/aes 等の
# 追加バックエンドは持ち込まない（展開は既に依存ツリーにある flate2 を使う）。追加される
# のは zip とその deflate 圧縮に使う pure-Rust の zopfli 系のみ（C ツールチェーン不要）。
zip = { version = "2", default-features = false, features = ["deflate"] }
# webhook intake（#454）の HMAC-SHA256 署名検証。`Hmac::verify_slice` が定数時間比較を
# 提供するので、署名照合は自前のバイト比較を書かずこれに委ねる（タイミング攻撃対策）。
hmac = "0.12"
sha2 = { workspace = true }
croner = "3.0.1"
chrono-tz = "0.10.4"

[dev-dependencies]
tempfile = { workspace = true }
# 進捗デバウンス（3 秒）のテストで仮想時計を進めるため（`#[tokio::test(start_paused)]`）。
tokio = { workspace = true, features = ["test-util"] }
tower = { workspace = true }
http-body-util = "0.1"
hyper = "1"
# #620: 移行/マスターキー検証テストで MasterKey（Arc<Zeroizing<[u8;32]>>）を組むため。
zeroize = "1"

[lints]
workspace = true
