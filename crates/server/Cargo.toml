[package]
name = "opencrab-server"
version.workspace = true
edition.workspace = true

[features]
default = ["discord"]
discord = ["dep:opencrab-discord", "dep:serenity"]

[dependencies]
tokio = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
iana-time-zone = { workspace = true }
dashmap = { workspace = true }
rusqlite = { workspace = true }
opencrab-core = { workspace = true }
opencrab-llm = { workspace = true }
opencrab-llm-types = { workspace = true }
opencrab-gateway = { workspace = true }
opencrab-actions = { workspace = true }
opencrab-db = { workspace = true }
opencrab-nostr = { workspace = true }
opencrab-mcp = { workspace = true }
dotenvy = { workspace = true }
toml = { workspace = true }
opencrab-discord = { workspace = true, optional = true }
opencrab-voice = { workspace = true }
serenity = { workspace = true, optional = true }
notify = "6"
notify-debouncer-mini = "0.4"
tiktoken-rs = "0.9.1"

[dev-dependencies]
tempfile = { workspace = true }
# 進捗デバウンス（3 秒）のテストで仮想時計を進めるため（`#[tokio::test(start_paused)]`）。
tokio = { workspace = true, features = ["test-util"] }
tower = { workspace = true }
http-body-util = "0.1"
hyper = "1"
# ローカル専用 E2E ハーネス（tests/e2e_local.rs）が稼働中サーバを HTTP/SSE で叩くため。
reqwest = { workspace = true }

[lints]
workspace = true
