[workspace]
resolver = "2"
members = [
    "crates/converter",
    "crates/port",
    "crates/store",
    "crates/engine",
    "crates/social-runtime",
    "crates/plugd",
    "crates/app",
    "crates/web-gate",
    "crates/nostr-gate",
]

[workspace.lints.clippy]
# ガードを .await 跨ぎで保持する事故の将来保険（#32）。DB は DbGuard が !Send で
# 構造的に防がれているが、他の std::sync::Mutex には型の防波堤が無い。
await_holding_lock = "deny"

[workspace.package]
version = "0.2.17"
edition = "2021"
license = "MIT"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
futures = "0.3"

serde_json = "1"
sha2 = "0.10"
sha1 = "0.10"
base64 = "0.22"

# HTTP
reqwest = { version = "0.12", features = ["json", "stream", "multipart"] }

# Database
rusqlite = { version = "0.32", features = ["bundled", "vtab"] }

# Tokenization (context budget accounting)
tiktoken-rs = "0.9.1"
regex = "1"

# 開発ビルド高速化: デバッグ情報を減らしてリンク時間とバイナリサイズを削減。
# debug=1 は行番号のみ（backtrace は出る）。依存は debug 無し。split で本体から分離。
[profile.dev]
debug = 1
split-debuginfo = "unpacked"

[profile.dev.package."*"]
debug = false
